[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitron"
version = "0.1.0"
description = "Orbitron — AI-powered personal assistant with multi-agent architecture"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Sven F."},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.28.0",
    "PyJWT>=2.8.0",
    "pypandoc>=1.14",
    "python-docx>=0.8.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
]
telegram = [
    "python-telegram-bot>=20.0",
]
calendar = [
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
]
browser = [
    "playwright>=1.40.0",
]
all = [
    "orbitron[dev,telegram,calendar,browser]",
]

[project.scripts]
orbitron = "OrbitronSystem.main:main"

[tool.setuptools.packages.find]
include = [
    "OrbitronKernel*",
    "OrbitronAgents*",
    "OrbitronMessageSystem*",
    "OrbitronSystem*",
    "OrbitronWordSystem*",
    "OrbitronCalendar*",
    "TelegramBot*",
    "OrbitronUtils*",
    "OrbitronTests*",
]

[tool.pytest.ini_options]
testpaths = ["OrbitronTests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true